# ── APPLICATION ───────────────────────────────────────────
spring.application.name=portfolio-backend


# ── SERVER ────────────────────────────────────────────────
server.port=8765
server.address=0.0.0.0


# ── DATABASE ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=biswa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ── JPA / HIBERNATE ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# ── SECURITY (OPTIONAL BASIC AUTH) ─────────────────────────
#spring.security.user.name=admin
#spring.security.user.password=admin


# ── JWT ───────────────────────────────────────────────────
jwt.secret=BISWA_PORTFOLIO_PROJECT_HELLO_EVERY_ONE_DONT_CHANGE_THIS
jwt.expiration=86400000
# 60000    1m         
# 86400000 24h


# ── FILE UPLOAD ───────────────────────────────────────────
#file.upload-dir=./uploads
#spring.servlet.multipart.max-file-size=10MB
#spring.servlet.multipart.max-request-size=10MB


# ── LOGGING ───────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG


